name: Build SD card image

on:
  workflow_dispatch:
    inputs:
      armbian_ref:
        description: armbian/build commit, tag or branch (a vX.Y.Z tag also sets the image version)
        default: v26.5.1
      release:
        description: Debian/Ubuntu release
        default: trixie
      swt6621s_ref:
        description: ohaiibuzzle/swt6621s commit, tag or branch for the Wi-Fi/BT DKMS package
        default: dkms
  push:
    tags: ["v*"]
    paths-ignore: ["**.md"]

permissions:
  contents: write # attach images to a Release on tag builds

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  ARMBIAN_REF: ${{ inputs.armbian_ref || 'v26.5.1' }}
  SWT6621S_REF: ${{ inputs.swt6621s_ref || 'dkms' }}
  RELEASE: ${{ inputs.release || 'trixie' }}

jobs:
  build:
    # Native arm64: the rootfs chroot and the DKMS build run without qemu emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Free disk space
        # A vendor kernel build needs ~40 GB; a stock runner has ~20 GB free.
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_folders: "/usr/share/swift /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL"

      - name: Prune Docker images
        run: |
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Check out Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_REF }}
          path: armbian-build

      - name: Add userpatches
        run: cp -a armbian/userpatches/. armbian-build/userpatches/

      - name: Check out Wi-Fi driver
        uses: actions/checkout@v4
        with:
          repository: ohaiibuzzle/swt6621s
          ref: ${{ env.SWT6621S_REF }}
          path: swt6621s

      - name: Build Wi-Fi DKMS package
        working-directory: swt6621s
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper build-essential
          dpkg-buildpackage -us -uc -b
          cp -v ../swt6621s-dkms_*.deb ../armbian-build/userpatches/x88pro/

      - name: Build image
        working-directory: armbian-build
        run: |
          # A release tag (v26.5.1) names the image 26.5.1 instead of the tree's "-trunk" VERSION.
          revision=()
          [[ "${ARMBIAN_REF}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] && revision=("REVISION=${BASH_REMATCH[1]}")
          ./compile.sh build \
            BOARD=hugsun-x88pro BRANCH=vendor RELEASE="${RELEASE}" \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no KERNEL_GIT=shallow \
            COMPRESS_OUTPUTIMAGE=sha,xz SHARE_LOG=no "${revision[@]}"

      - name: Check loader in image
        working-directory: armbian-build/output/images
        run: |
          img=$(ls *.img.xz)
          xz -dc "$img" | head -c $((16384 * 512 + $(stat -c %s ../../userpatches/x88pro/u-boot.itb))) > head.bin
          cmp -n "$(stat -c %s ../../userpatches/x88pro/factory_idbloader_x88pro.bin)" \
            ../../userpatches/x88pro/factory_idbloader_x88pro.bin <(tail -c +$((64 * 512 + 1)) head.bin)
          cmp ../../userpatches/x88pro/u-boot.itb <(tail -c +$((16384 * 512 + 1)) head.bin)
          rm head.bin
          echo "factory idbloader @64 and u-boot.itb @16384 OK"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-hugsun-x88pro-${{ env.RELEASE }}
          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha
            armbian-build/output/images/*.img.txt
          compression-level: 0 # already xz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: armbian-build/output/logs/
